name: Déploiement vers GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer un fichier index.html simple
        run: |
          mkdir site
          echo '<h1>Bravo !</h1><p>Ceci est le résultat final visible dans le navigateur.</p>' > site/index.html

      - name: Déployer sur GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
name: Deploy CI CD Demo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "Vérification du projet..."
          ls -la

      - name: Test HTML presence
        run: |
          test -f index.html && echo "index.html trouvé"

      - name: Deploy message
        run: |
          echo "Déploiement simulé avec succès"